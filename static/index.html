<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <h1 class="title"><button class="title-btn" id="homeTitle" aria-label="Switch home">My Home</button></h1>
    <div class="top-actions">
      <span class="live-dot" id="liveDot" title="Live updates"></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Home settings">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </div>
  <nav class="rooms-nav" id="roomsNav" aria-label="Rooms"></nav>
</header>

<main id="main" class="main" tabindex="-1">
  <div class="status-chips" id="chips"></div>
  <div id="content"></div>
</main>

<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grabber" aria-hidden="true"></div>
  <div class="sheet-inner" id="sheetInner"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
