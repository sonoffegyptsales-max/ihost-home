name: tuya-bridge image

on:
  push:
    branches: [main]
    paths: ["tuya-bridge/**", ".github/workflows/tuya-bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Work out image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/${owner}/ihost-tuya-bridge:latest"
          tags="${tags},ghcr.io/${owner}/ihost-tuya-bridge:${GITHUB_SHA::7}"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            tags="${tags},${{ secrets.DOCKERHUB_USERNAME }}/ihost-tuya-bridge:latest"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.names.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tuya-bridge
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the armv7 image (the iHost's architecture)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${owner}/ihost-tuya-bridge:${GITHUB_SHA::7}"
          docker run --rm --platform linux/arm/v7 "$img" python -c "import platform, tinytuya, cryptography; print(platform.machine(), 'tinytuya', tinytuya.__version__, 'cryptography', cryptography.__version__)"
          docker run -d --name tb --platform linux/arm/v7 -p 8321:8321 "$img"
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8321/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8321/healthz
          curl -sf http://127.0.0.1:8321/api/status | head -c 300; echo
          docker logs tb
