name: tuya-bridge image

on:
  push:
    branches: [main]
    paths: ["tuya-bridge/**", ".github/workflows/tuya-bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (the iHost's "Add add-on" search only looks there). Secrets are trimmed because a
      # pasted space/newline makes Docker Hub answer "malformed HTTP Authorization header".
      - name: Log in to Docker Hub and work out image names
        id: names
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/${owner}/ihost-tuya-bridge:latest,ghcr.io/${owner}/ihost-tuya-bridge:${GITHUB_SHA::7}"
          user=$(printf '%s' "$DH_USER" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          token=$(printf '%s' "$DH_TOKEN" | tr -d '[:space:]')
          if [ -n "$user" ]; then
            echo "Docker Hub user length ${#user} | token length ${#token} | token starts with dckr_pat_: $([ "${token#dckr_pat_}" != "$token" ] && echo yes || echo no)"
            case "$user" in *@*) echo "::error::DOCKERHUB_USERNAME must be the Docker Hub username, not the e-mail address"; exit 1;; esac
            printf '%s' "$token" | docker login -u "$user" --password-stdin
            tags="${tags},${user}/ihost-tuya-bridge:latest"
            echo "dockerhub_image=${user}/ihost-tuya-bridge" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: tuya-bridge
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the armv7 image (the iHost's architecture)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${owner}/ihost-tuya-bridge:${GITHUB_SHA::7}"
          docker run --rm --platform linux/arm/v7 "$img" python -c "import platform, tinytuya, cryptography; print(platform.machine(), 'tinytuya', tinytuya.__version__, 'cryptography', cryptography.__version__)"
          docker run -d --name tb --platform linux/arm/v7 -p 8321:8321 "$img"
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8321/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8321/healthz
          curl -sf http://127.0.0.1:8321/api/status | head -c 300; echo
          docker logs tb
          echo "Docker Hub image: ${{ steps.names.outputs.dockerhub_image }}"
